        .toggle-btn.active { background: #2563eb; color: white; }

        .btn-save { background: #059669; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-img { background: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

        </div>

            <div style="display:flex; gap:4px;">
                <button class="btn-room" style="background:#2563eb;" onclick="copyRoomLink()">🔗 共有</button>
                <button class="btn-room" onclick="promptSwitchRoom()">切替/新規</button>
            </div>
        </div>

            <div class="row">

                        <button id="toggle-hidden" class="toggle-btn" onclick="setDisplayMode('hidden')">🚫 隠す</button>
                    </div>
                </div>
                <div class="mode-group">

                    <button id="mode-start" class="mode-btn" onclick="setMode('start')">🚩</button>
                    <button id="mode-home" class="mode-btn" onclick="setMode('home')">🏰</button>
                </div>
                <button class="btn-img" onclick="savePngImage()">📸 マップ画像をPNG保存</button>
                <button class="btn-save" onclick="generateShortUrl()">🔗 短縮保存URLを発行</button>

        </div>
