<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陣取り戦場マップ (標準160マス・img/image.png) - 領地作戦シミュレーター</title>
    <style>
        :root { --panel-width: 300px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f172a; color: white; height: 100vh; display: flex; overflow: hidden; }
        .main-wrapper { display: flex; width: 100%; height: 100%; }
        #map-outer { flex: 1; position: relative; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
        #map-container { position: relative; line-height: 0; display: inline-block; }
        #baseImg { display: block; max-width: 100%; max-height: 100vh; width: auto; height: auto; pointer-events: none; }
        #mapCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: crosshair; touch-action: pinch-zoom; }
        .side-panel { width: var(--panel-width); background: #1e293b; display: flex; flex-direction: column; flex-shrink: 0; border-left: 1px solid #334155; z-index: 20; }
        @media (max-width: 800px) {
            body { overflow: auto; }
            .main-wrapper { flex-direction: column; height: auto; min-height: 100vh; }
            #map-outer { height: 60vh; flex: none; }
            .side-panel { width: 100%; height: auto; min-height: 40vh; border-left: none; border-top: 1px solid #334155; }
            #score-container { overflow-y: visible !important; }
        }
        .room-bar { background: #0f172a; padding: 10px 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-size: 12px; gap: 8px; }
        .room-title { font-weight: bold; color: #fbbf24; font-family: monospace; }
        .btn-room { background: #d97706; hover: background: #b45309; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .controls { padding: 10px 12px; border-bottom: 1px solid #334155; background: #1e293b; position: sticky; top: 0; z-index: 30; }
        .row { display: flex; flex-direction: column; gap: 8px; }
        .row-group { display: flex; gap: 6px; align-items: center; }
        .row-group > * { flex: 1; width: 50%; }
        .mode-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
        .toggle-group { display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 2px; }
        .toggle-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 6px; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .toggle-btn.active { background: #2563eb; color: white; }
        #colorSelect { background: #334155; color: white; border: 1px solid #475569; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; height: 38px; }
        .mode-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #2563eb; color: white; border-color: #60a5fa; box-shadow: 0 0 8px rgba(37,99,235,0.6); }
        .btn-save { background: #059669; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-img { background: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-reset { background: #475569; color: #f1f5f9; border: 1px solid #64748b; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; height: 38px; }
        #score-container { flex: 1; overflow-y: auto; padding: 12px; background: #0f172a; }
        .score-list { display: flex; flex-direction: column; gap: 6px; }
        .score-card { background: #1e293b; padding: 8px 12px; border-radius: 6px; border-left: 6px solid transparent; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; border-left-width: 6px; }
        .score-info { font-size: 13px; font-weight: bold; color: #f8fafc; }
        .score-val { font-size: 16px; font-weight: bold; color: #fbbf24; text-align: right; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="map-outer">
        <div id="map-container">
            <img id="baseImg" src="img/image.png" style="" onerror="this.style.display='none'">
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>
    <div class="side-panel">
        <div class="room-bar">
            <div>🚪 部屋: <span id="roomNameDisplay" class="room-title">メイン</span></div>
            <div style="display:flex; gap:4px;">
                <button class="btn-room" style="background:#2563eb;" onclick="copyRoomLink()">🔗 共有</button>
                <button class="btn-room" onclick="promptSwitchRoom()">切替/新規</button>
            </div>
        </div>
        <div class="controls">
            <div class="row">
                <div class="row-group">
                    <select id="colorSelect" onchange="updateSelectedColor(this.value)"></select>
                    <button class="btn-reset" onclick="if(confirm('リセットしますか？')) { areaStatus={}; startPositions=[]; homePos=null; saveCurrentRoom(); initUI(); }">リセット</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:4px 8px; border-radius:6px; border:1px solid #334155; font-size:11px;">
                    <span style="color:#94a3b8; font-weight:bold;">🏷️ 表示:</span>
                    <div class="toggle-group" style="width:140px;">
                        <button id="toggle-badge" class="toggle-btn active" onclick="setDisplayMode('badge')">🏷️ 数字</button>
                        <button id="toggle-hidden" class="toggle-btn" onclick="setDisplayMode('hidden')">🚫 隠す</button>
                    </div>
                </div>
                <div class="mode-group">
                    <button id="mode-paint" class="mode-btn active" onclick="setMode('paint')">塗り</button>
                    <button id="mode-start" class="mode-btn" onclick="setMode('start')">🚩</button>
                    <button id="mode-home" class="mode-btn" onclick="setMode('home')">🏰</button>
                </div>
                <button class="btn-img" onclick="savePngImage()">📸 マップ画像をPNG保存</button>
                <button class="btn-save" onclick="generateShortUrl()">🔗 短縮保存URLを発行</button>
            </div>
        </div>
        <div id="score-container">
            <div id="score-board" class="score-list"></div>
        </div>
    </div>
</div>

            setupFromBase(base);
        } else if (base) {
            base.onload = () => setupFromBase(base);
            base.onerror = () => { setupCanvas(1200, 1200); loadCurrentRoom(); initUI(); };
        } else {
            setupCanvas(1200, 1200); loadCurrentRoom(); initUI();
        }
    };

    function setupFromBase(img) {
        setupCanvas(img.naturalWidth || 1200, img.naturalHeight || 1200);
        const tCanvas = document.createElement('canvas'); tCanvas.width = canvas.width; tCanvas.height = canvas.height;
        const tCtx = tCanvas.getContext('2d'); tCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
        maskData = tCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        loadCurrentRoom();
        initUI();
    }

    function setupCanvas(w, h) {
        canvas.width = paintCanvas.width = w;
        canvas.height = paintCanvas.height = h;
    }

    function initUI() {
        colorList.forEach(c => { scores[c] = 0; counts[c] = 0; });
        const select = document.getElementById('colorSelect');
        select.innerHTML = '';
        colorList.forEach((color, i) => { const opt = document.createElement('option'); opt.value = color; opt.textContent = colorNames[i]; select.appendChild(opt); });
        updateSelectedColor(colorList[0]);
        updateBoard();
        render();
    }

    function updateSelectedColor(val) {
        selectedColor = val;
        const sel = document.getElementById('colorSelect');
        if (sel) {
            sel.value = val;
            sel.style.backgroundColor = val;
        }
        setMode('paint');

    function setMode(mode) { currentMode = mode; document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active')); document.getElementById('mode-' + mode).classList.add('active'); }
    function setDisplayMode(mode) {
        nodeDisplayMode = mode;
        document.getElementById('toggle-badge').classList.toggle('active', mode === 'badge');
        document.getElementById('toggle-hidden').classList.toggle('active', mode === 'hidden');
        render();
    }
    function savePngImage() {
        const link = document.createElement('a');
        link.download = 'map_' + currentRoom + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const x = Math.floor((e.clientX - rect.left) * scaleX), y = Math.floor((e.clientY - rect.top) * scaleY);
        if (currentMode === 'start') {
            const idx = startPositions.findIndex(p => Math.sqrt((p.x-x)**2 + (p.y-y)**2) < 40);
            if (idx > -1) startPositions.splice(idx, 1); else startPositions.push({x, y});
            saveCurrentRoom(); render(); return;
        }
        if (currentMode === 'home') { homePos = {x, y}; saveCurrentRoom(); render(); return; }
        
        let nearest = null, minDist = 9999; 
        mapMasterData.forEach(p => { 
            const px = p.x * canvas.width / 100, py = p.y * canvas.height / 100; 
            const d = Math.sqrt((px-x)**2 + (py-y)**2); 
            if (d < minDist) { minDist = d; nearest = p; } 
        });
        if (nearest && minDist < 60) applyPaint(nearest, x, y);
    });

    function applyPaint(nearest, x, y) {
        const key = nearest.x + '-' + nearest.y;
        const rgb = hexToRgb(selectedColor);
        if (areaStatus[key] === selectedColor) { 
            if (maskData) floodFill(x, y, {r:0,g:0,b:0}, true); 
            else fillCircle(nearest, null);
            scores[selectedColor] -= (pointsConfig[nearest.lv] || 0); counts[selectedColor] -= 1; delete areaStatus[key]; 
        } else {
            if (areaStatus[key]) { scores[areaStatus[key]] -= (pointsConfig[nearest.lv] || 0); counts[areaStatus[key]] -= 1; }
            if (maskData) floodFill(x, y, rgb, false); 
            else fillCircle(nearest, selectedColor);
            scores[selectedColor] += (pointsConfig[nearest.lv] || 0); counts[selectedColor] += 1; areaStatus[key] = selectedColor;
        }
        saveCurrentRoom();
        updateBoard();
        render();
    }

    function fillCircle(point, color) {
        const px = point.x * canvas.width / 100, py = point.y * canvas.height / 100;
        pCtx.save();
        if (!color) {
            pCtx.globalCompositeOperation = 'destination-out';
            pCtx.beginPath();
            pCtx.arc(px, py, 26, 0, Math.PI * 2);
            pCtx.fill();
        } else {
            pCtx.globalCompositeOperation = 'source-over';
            pCtx.fillStyle = color;
            pCtx.beginPath();
            pCtx.arc(px, py, 26, 0, Math.PI * 2);
            pCtx.fill();
        }
        pCtx.restore();
    }

    function floodFill(startX, startY, targetRgb, isErase) {
        const w = canvas.width, h = canvas.height;
        const pImgData = pCtx.getImageData(0, 0, w, h);
        const pData = pImgData.data;
        const visited = new Uint8Array(w * h);
        const stack = [[startX, startY]];

        while (stack.length > 0) {
            const [cx, cy] = stack.pop();
            const idx = (cy * w + cx) * 4;
            if (cx < 0 || cx >= w || cy < 0 || cy >= h || visited[cy * w + cx]) continue;
            visited[cy * w + cx] = 1;

            if (maskData) {
                const mr = maskData[idx], mg = maskData[idx+1], mb = maskData[idx+2];
                if (mr < 60 && mg < 60 && mb < 60) continue;
            }

            if (isErase) {
                pData[idx+3] = 0;
            } else {
                pData[idx] = targetRgb.r;
                pData[idx+1] = targetRgb.g;
                pData[idx+2] = targetRgb.b;
                pData[idx+3] = 235;
            }

            stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
        pCtx.putImageData(pImgData, 0, 0);
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(paintCanvas, 0, 0);

        if (nodeDisplayMode === 'badge') {
            mapMasterData.forEach(p => {
                const px = p.x * canvas.width / 100, py = p.y * canvas.height / 100;
                ctx.beginPath();
                ctx.arc(px, py, 11, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15,23,42,0.85)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = areaStatus[p.x + '-' + p.y] || '#64748b';
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.lv, px, py);
            });
        }

        ctx.font = "bold 44px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        startPositions.forEach(p => ctx.fillText("🚩", p.x, p.y)); 
        if (homePos) ctx.fillText("🏰", homePos.x, homePos.y);
    }

    function updateBoard() {
        const board = document.getElementById('score-board'); board.innerHTML = '';
        let activeAlliances = [];
        colorList.forEach((c, i) => { 
            if (counts[c] > 0) activeAlliances.push({ color: c, name: colorNames[i], score: scores[c] || 0, count: counts[c] || 0 }); 
        });
        activeAlliances.sort((a, b) => b.score - a.score);
        activeAlliances.forEach(all => {
            const card = document.createElement('div'); card.className = 'score-card'; card.style.borderLeftColor = all.color;
            card.style.cursor = 'pointer';
            card.title = 'クリックしてこの同盟の色を選択';
            card.onclick = () => updateSelectedColor(all.color);
            const isSelected = selectedColor.toLowerCase() === all.color.toLowerCase();
            if (isSelected) {
                card.style.outline = '2px solid #fbbf24';
            }
            card.innerHTML = '<div class="score-info"><div>' + all.name + (isSelected ? ' <span style="font-size:10px; background:#fbbf24; color:#000; padding:1px 4px; border-radius:3px; font-weight:bold;">選択中</span>' : '') + '</div><div style="font-size:11px; color:#94a3b8; font-weight:normal;">' + all.count + ' マス占領</div></div><div class="score-val">' + (all.score).toLocaleString() + '</div>';
            board.appendChild(card);
        });
        if (activeAlliances.length === 0) board.innerHTML = '<div style="text-align:center; color:#64748b; padding-top:20px; font-size:12px;">マスをタップして塗りを開始</div>';
    }

    function hexToRgb(hex) { return { r: parseInt(hex.slice(1,3), 16), g: parseInt(hex.slice(3,5), 16), b: parseInt(hex.slice(5,7), 16) }; }

    function saveCurrentRoom() {
        try {
            const data = { areaStatus, startPositions, homePos, updatedAt: new Date().toISOString() };
            localStorage.setItem('map_room_' + currentRoom, JSON.stringify(data));
        } catch(e) {}
    }

    function loadCurrentRoom() {
        try {
            const raw = localStorage.getItem('map_room_' + currentRoom);
            if (raw) {
                const data = JSON.parse(raw);
                areaStatus = data.areaStatus || {};
                startPositions = data.startPositions || [];
                homePos = data.homePos || null;
            }
        } catch(e) {}
    }

    function promptSwitchRoom() {
        const name = prompt('移動または新規作成する部屋名を入力してください:', currentRoom === 'main' ? '' : currentRoom);
        if (name !== null) {
            const clean = name.trim() || 'main';
            saveCurrentRoom();
            currentRoom = clean;
            const url = new URL(window.location.href);
            if (clean !== 'main') url.searchParams.set('room', clean); else url.searchParams.delete('room');
            window.history.replaceState({}, '', url.toString());
            document.getElementById('roomNameDisplay').textContent = clean === 'main' ? 'メイン' : clean;
            pCtx.clearRect(0,0,canvas.width,canvas.height);
            loadCurrentRoom();
            initUI();
        }
    }

    function copyRoomLink() {
        const url = new URL(window.location.href);
        if (currentRoom !== 'main') url.searchParams.set('room', currentRoom); else url.searchParams.delete('room');
        url.searchParams.delete('v2'); url.searchParams.delete('v3');
        navigator.clipboard.writeText(url.toString()).then(() => alert('部屋「' + currentRoom + '」の共有URLをコピーしました！'));
    }

    function generateShortUrl() {
        const c = {}; 
        Object.entries(areaStatus).forEach(([key, color]) => {
            const [kx, ky] = key.split('-').map(Number);
            const idx = mapMasterData.findIndex(m => m.x === kx && m.y === ky);
            if (idx !== -1) {
                const cIdx = colorList.indexOf(color);
                if (!c[cIdx]) c[cIdx] = [];
                c[cIdx].push(idx);
            }
        });
        const s = []; 
        startPositions.forEach(p => { s.push(p.x, p.y); });
        const h = homePos ? [homePos.x, homePos.y] : [];
        const data = { c, s, h };
        const encoded = btoa(JSON.stringify(data)); 
        const longUrl = window.location.href.split('?')[0] + (currentRoom !== 'main' ? '?room=' + currentRoom + '&' : '?') + "v2=" + encoded;
        navigator.clipboard.writeText(longUrl).then(() => alert("URLをコピーしました！"));
    }
</script>
